# Production deployment is intentionally manual during the isolated-worker migration.
name: Build and deploy Scoreboardly Azure Functions

on:
  workflow_dispatch:
    inputs:
      runtime_configured:
        description: Confirm the Function App is configured for dotnet-isolated and supports .NET 10.
        required: true
        type: choice
        options:
          - I have configured and verified the Function App runtime

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish isolated Azure Functions app
        run: dotnet publish ./Scoreboardly.Application.Functions/Scoreboardly.Application.Functions.csproj --configuration Release --output ./publish

      - name: Deploy Azure Functions app
        uses: Azure/functions-action@v1
        with:
          app-name: 'shandsj-scoreboardly'
          slot-name: 'Production'
          package: './publish'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_12380161189F4877B215AE0B824F674E }}
